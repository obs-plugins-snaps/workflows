# CI for the e2e tooling: lint, tests and type checks are orchestrated
# by tox (see tox.toml) so the command logic lives next to the code;
# actionlint validates the workflow files themselves.

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Test e2e tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Run lint
        run: uv run tox run -e lint

      - name: Run actionlint
        run: |
          curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash -s --
          ./actionlint -color

      - name: Run tests
        run: uv run tox run -e 3.12

      - name: Run type checks
        run: uv run tox run -e ty
