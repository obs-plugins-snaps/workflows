name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Test e2e tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      # PyGObject and pycairo ship no Linux wheels; building them from
      # source needs the GObject introspection and cairo headers.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2-dev \
            libgirepository1.0-dev \
            pkg-config

      - name: Run lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run actionlint
        run: |
          curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash -s --
          ./actionlint -color

      - name: Run tests
        run: uv run pytest -v

      - name: Run type checks
        run: uv run ty check
