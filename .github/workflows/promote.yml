name: Promote

on:
  workflow_call:
    inputs:
      plugin_name:
        description: >-
          Name of the upstream plugin project. The snap name is
          "<plugin_name>-obs-studio".
        required: true
        type: string
      revision:
        description: >-
          Revision to promote: a store revision number, a comma-separated
          list of them, or "latest" for the newest revision in latest/edge.
        required: false
        type: string
        default: latest
      channel:
        description: >-
          Target risk level: beta, candidate or stable.
        required: true
        type: string

permissions:
  contents: read

jobs:
  promote:
    name: ⬆️ Promote revisions to a risk level
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # This workflow is meant to be triggered manually: the caller declares a
    # workflow_dispatch trigger with matching inputs and forwards them here.
    # GitHub requires write access to dispatch a workflow, so no extra
    # permission check is needed.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: 🛠 Set up snapcraft
        uses: canonical/craft-actions/snapcraft/setup@main

      - name: ⬆️ Promote
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          snap_name: ${{ inputs.plugin_name }}-obs-studio
          requested_channel: ${{ inputs.channel }}
          requested_revision: ${{ inputs.revision }}
        run: |
          set -euo pipefail

          case "$requested_channel" in
            latest/beta|beta)           channel="latest/beta" ;;
            latest/candidate|candidate) channel="latest/candidate" ;;
            latest/stable|stable)       channel="latest/stable" ;;
            *)
              echo "::error::'$requested_channel' is not a supported risk level. Use beta, candidate or stable."
              exit 1
              ;;
          esac

          # Accept "latest" as a shortcut for the newest revision in edge.
          if [[ "$requested_revision" == "latest" ]]; then
            requested_revision="$(snapcraft revisions "$snap_name" \
              | awk '/latest\/edge/ {gsub(/[^0-9]/, "", $1); if ($1 != "") revision = $1} END {print revision}')"
            if [[ -z "$requested_revision" ]]; then
              echo "::error::Could not find any revision in the latest/edge channel."
              exit 1
            fi
          fi

          if [[ ! "$requested_revision" =~ ^[0-9]+([,][0-9]+)*$ ]]; then
            echo "::error::Revision must be a number or a comma-separated list of numbers (or latest), not '$requested_revision'."
            exit 1
          fi

          released=""
          failed=""
          for revision in ${requested_revision//,/ }; do
            if snapcraft release "$snap_name" "$revision" "$channel"; then
              released="${released:+$released,}$revision"
            else
              failed="${failed:+$failed,}$revision"
            fi
          done

          summary=""
          if [[ -n "$released" ]]; then
            summary+="The following revisions were released to the \`$channel\` channel: \`$released\`. "
          fi
          if [[ -n "$failed" ]]; then
            summary+="The following revisions could not be released: \`$failed\`. Check the workflow logs for details. "
          fi
          echo "$summary" >> "$GITHUB_STEP_SUMMARY"
