name: Release to edge

on:
  workflow_call:
    inputs:
      plugin_name:
        description: >-
          Name of the upstream plugin project. The snap name is
          "<plugin_name>-obs-studio".
        required: true
        type: string

concurrency:
  # Serialize releases per branch so that two pushes to main never race to
  # upload to the same channel. Never cancel an in-progress release, or we
  # could end up with an uploaded-but-unreleased snap.
  group: release-to-edge-${{ inputs.plugin_name }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-snap.yml
    with:
      plugin_name: ${{ inputs.plugin_name }}

  release:
    name: 🚢 Release to latest/edge
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 🛠 Set up snapcraft
        uses: canonical/craft-actions/snapcraft/setup@main

      - name: ⬇️ Download packed snaps
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.plugin_name }}-snap

      - name: 🚢 Upload and release to latest/edge
        id: release
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_EDGE }}
        run: |
          set -euo pipefail

          command -v snapcraft >/dev/null || sudo snap install snapcraft --classic

          echo "| Architecture | Version | Revision |" >> summary.md
          echo "| ------------ | ------- | -------- |" >> summary.md

          revisions=""
          for snap_file in ./*.snap; do
            out="$(snapcraft upload "$snap_file" --release=latest/edge)"
            revision="$(echo "$out" | grep -oP 'Revision \K[0-9]+')"

            # Snap file names look like "<snap>_<version>_<arch>.snap".
            version="$(echo "$snap_file" | cut -d_ -f2)"
            architecture="$(echo "$snap_file" | cut -d_ -f3 | sed 's/\.snap$//')"

            revisions="${revisions:+$revisions,}$revision"
            echo "| $architecture | $version | $revision |" >> summary.md
          done

          echo "revisions=$revisions" >> "$GITHUB_OUTPUT"

          cat >> summary.md <<EOF

          To promote this release to beta, candidate, or stable, run the
          "${{ github.workflow }}" workflow from the Actions tab of this
          repository: set \`channel\` to the target risk level, and leave
          \`revision\` as \`latest\` to promote the newest revision in
          \`latest/edge\` (this release), or set it to a specific revision
          number.
          EOF

          cat summary.md >> "$GITHUB_STEP_SUMMARY"
