name: Build snap

on:
  workflow_call:
    inputs:
      plugin_name:
        description: >-
          Name of the upstream plugin project, used to identify the
          packaged plugin in logs and artifact names
        required: true
        type: string
      timeout-minutes:
        description: >-
          Maximum runtime of the pack job, in minutes. Defaults to 60;
          slow-building plugins may raise it at the call site (e.g. in
          ci.yaml) via `timeout-minutes:` in the `with:` block.
        required: false
        type: number

jobs:
  pack:
    name: Pack snap
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes || 60 }}
    steps:
      - uses: actions/checkout@v7

      - uses: canonical/craft-actions/snapcraft/pack@main
        id: pack

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.plugin_name }}-snap
          path: ${{ steps.pack.outputs.snaps }}
