name: Build snap

on:
  workflow_call:
    inputs:
      plugin_name:
        description: >-
          Name of the upstream plugin project, used to identify the
          packaged plugin in logs and artifact names
        required: true
        type: string

jobs:
  pack:
    name: Pack snap
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # Default icon: the org avatar. Repos may override it by shipping
      # their own snap/gui/icon.png (checked out above, if present).
      - name: 🖼️ Fetch default icon
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! -f snap/gui/icon.png ]]; then
            mkdir -p snap/meta/gui
            org_id="$(curl -fsSL https://api.github.com/orgs/obs-plugins-snaps | jq -r .id)"
            curl -fsSL -o snap/gui/icon.png \
              "https://avatars.githubusercontent.com/u/${org_id}?size=256"
          fi

      - uses: canonical/craft-actions/snapcraft/pack@main
        id: pack

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.plugin_name }}-snap
          path: ${{ steps.pack.outputs.snaps }}
