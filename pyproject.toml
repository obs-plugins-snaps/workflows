[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[project]
name = "e2e-obs-plugins-snaps"
version = "0.1.0"
description = "Wayland-native end-to-end GUI harness for OBS plugin snaps"
readme = "README.md"
authors = [
    { name = "Juan Luis Cano Rodríguez", email = "juan.rodriguez@canonical.com" }
]
requires-python = ">=3.12"
dependencies = [
    "atspi",
    "sway-windows",
]

[project.scripts]
e2e-obs = "e2e_obs.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.13",
    "ty>=0.0.100",
    "tox-uv>=1",
]

[tool.uv.workspace]
members = [
    "packages/atspi",
    "packages/sway-windows",
]

[tool.uv.sources]
atspi = { workspace = true }
sway-windows = { workspace = true }

[tool.uv.build-backend]
module-name = "e2e_obs"

[tool.ruff]
show-fixes = true

[tool.ruff.lint]
select = [
    "F",  # Pyflakes
    "E",  # Pycodestyle
    "W",  # Pycodestyle
    # "D",  # Pydocstyle
    "UP",  # pyupgrade
    "I",  # isort
    "PL",  # Pylint
]
ignore = [
    "D203",  # incorrect-blank-line-before-class (prefer D211: no-blank-line-before-class)
    "D213",  # multi-line-summary-second-line (prefer D212: multi-line-summary-first-line)
]

[tool.ruff.lint.per-file-ignores]
# (gitignore-style anchoring: "tests/**" alone only matches the root
# tests/ directory, not the members' test dirs)
"**/tests/**" = ["D", "PLR2004"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ty.rules]
# Enable disabled-by-default rules
possibly-unresolved-reference = "warn"
possibly-missing-attribute = "warn"
possibly-missing-import = "warn"

# Enable preview rules
call-abstract-method = "warn"
unused-awaitable = "warn"

# Promote warnings to errors (optional, stricter)
deprecated = "error"
unused-ignore-comment = "error"
unused-type-ignore-comment = "error"

[tool.ty.terminal]
error-on-warning = true  # treat all warnings as errors

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = [
    "tests",
    "packages/atspi/tests",
    "packages/sway-windows/tests",
]
