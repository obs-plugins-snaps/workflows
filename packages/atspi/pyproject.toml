[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[project]
name = "atspi"
version = "0.1.0"
description = "Inspect and drive GUI applications over AT-SPI (accessibility)"
readme = "README.md"
authors = [
    { name = "Juan Luis Cano Rodríguez", email = "juan.rodriguez@canonical.com" }
]
requires-python = ">=3.12"
dependencies = [
    "PyGObject>=3.52",
]

[project.scripts]
atspi = "atspi.cli:main"
